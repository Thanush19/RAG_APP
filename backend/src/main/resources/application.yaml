spring:
  application:
    name: todo-backend

  # PostgreSQL - Neon
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Database migrations
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Render provides PORT automatically.
  # Locally, defaults to 8080.
  port: ${PORT:${SERVER_PORT:8080}}

# Production monitoring
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      probes:
        enabled: true

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

# Logging
logging:
  level:
    root: INFO
    com.example.backend: INFO
    org.flywaydb: INFO
    org.springframework.boot.autoconfigure.flyway: INFO

# Application configuration
app:

  # JWT Security
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
      access-token-expiration: ${APP_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION:900000}
      refresh-token-expiration-ms: ${APP_SECURITY_JWT_REFRESH_TOKEN_EXPIRATION_MS:2592000000}

  # Cloudinary - PDF Storage
  storage:
    cloudinary:
      cloud-name: ${APP_STORAGE_CLOUDINARY_CLOUD_NAME}
      api-key: ${APP_STORAGE_CLOUDINARY_API_KEY}
      api-secret: ${APP_STORAGE_CLOUDINARY_API_SECRET}

  # NVIDIA AI - LLM and Embeddings
  ai:
    nvidia:
      api-key: ${APP_AI_NVIDIA_API_KEY}
      base-url: ${APP_AI_NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
      embedding-model: ${APP_AI_NVIDIA_EMBEDDING_MODEL:nvidia/nemotron-3.5-embed-1b}
      chat-model: ${APP_AI_NVIDIA_CHAT_MODEL:nvidia/nemotron-3.5-lightning-30b-a3b}
      chat-max-tokens: ${APP_AI_NVIDIA_CHAT_MAX_TOKENS:2048}
      connect-timeout-seconds: ${APP_AI_NVIDIA_CONNECT_TIMEOUT_SECONDS:10}
      read-timeout-seconds: ${APP_AI_NVIDIA_READ_TIMEOUT_SECONDS:120}
      stream-timeout-seconds: ${APP_AI_NVIDIA_STREAM_TIMEOUT_SECONDS:180}

  # Qdrant - Vector Database
  vector:
    qdrant:
      url: ${APP_VECTOR_QDRANT_URL}
      api-key: ${APP_VECTOR_QDRANT_API_KEY}
      collection-name: ${APP_VECTOR_QDRANT_COLLECTION_NAME:document_chunks}
      timeout-seconds: ${APP_VECTOR_QDRANT_TIMEOUT_SECONDS:30}

      orphan-sweep:
        enabled: ${APP_VECTOR_QDRANT_ORPHAN_SWEEP_ENABLED:true}
        interval-millis: ${APP_VECTOR_QDRANT_ORPHAN_SWEEP_INTERVAL_MILLIS:3600000}