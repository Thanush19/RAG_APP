room = "2.8.5"
datastore = "1.3.0"
securityCrypto = "1.1.0-alpha06"
junit = "4.13.2"
turbine = "1.2.1"
mockwebserver = "5.5.1"
espresso = "3.7.0"
testExtJunit = "1.2.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
