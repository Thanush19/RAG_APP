org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend origin per flavor. Uncomment to override the defaults baked into
# app/build.gradle.kts (dev: http://127.0.0.1:8080/, prod: https://api.example.invalid/).
# A phone on the same Wi-Fi as the PC needs the PC's LAN address, not 127.0.0.1.
# rag.devBaseUrl=http://192.168.1.5:8080/
# rag.prodBaseUrl=https://api.yourhost.example/

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
