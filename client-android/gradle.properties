org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend origin per flavor. Uncomment to override the defaults baked into
# app/build.gradle.kts (dev: http://127.0.0.1:8080/, prod: https://api.example.invalid/).
#
# The dev phone talks to the PC over Wi-Fi, so this is the PC's LAN address —
# not 127.0.0.1, which only works through `adb reverse tcp:8080 tcp:8080` and
# that tunnel dies on every replug and every adb-server restart. Re-check the
# address with `ipconfig` after a router reboot; if it changed, put the new one
# here and rebuild. Reserving the PC's address in the router makes it permanent.
# Tomcat already binds 0.0.0.0, so no backend change is needed.
rag.devBaseUrl=http://192.168.1.5:8080/
# rag.prodBaseUrl=https://api.yourhost.example/

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
